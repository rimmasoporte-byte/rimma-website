<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#192c21">
  <title>RIMMA · Fotografiar trabajo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/photo-capture.css?v=20261005-v1">
  <script src="/app/photo-capture.js?v=20261005-v1" defer></script>
</head>
<body>
  <main class="capture-shell">
    <section class="capture-card" aria-labelledby="capture-title">
      <div class="capture-brand">RIMMA</div>
      <span class="capture-kicker" id="capture-workshop">TU TALLER</span>
      <h1 id="capture-title">Fotografiar trabajo</h1>
      <div id="capture-context" class="capture-context" hidden>
        <span id="capture-garment"></span>
        <strong id="capture-work"></strong>
      </div>
      <p id="capture-help">Abriendo una sesión segura…</p>
      <div id="capture-error" class="capture-message error" role="alert" hidden></div>
      <div id="capture-success" class="capture-message success" role="status" hidden></div>
      <label class="capture-button" id="capture-label" hidden>
        <span>Hacer foto</span>
        <input id="capture-file" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
      </label>
      <button id="capture-again" class="capture-secondary" type="button" hidden>Hacer otra foto</button>
      <p class="capture-foot">La foto se reduce automáticamente a un máximo de 150 KB antes de guardarse en RIMMA.</p>
    </section>
  </main>
</body>
</html>
