name: RIMMA Web Portal Preflight
on:
  push:
    branches:
      - feat/web-portal-stage
  pull_request:
    paths:
      - 'webapp/**'
      - '.github/workflows/webapp-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
