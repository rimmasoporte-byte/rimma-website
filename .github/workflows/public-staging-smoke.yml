name: RIMMA staging and official-site smoke
on:
  push:
    branches: [feat/webapp-prod-prep-20260927]
    paths: ['ops/public-staging-smoke.test.mjs', '.github/workflows/public-staging-smoke.yml']
  pull_request:
    branches: [feat/webapp-prod-prep-20260927]
    paths: ['ops/public-staging-smoke.test.mjs', '.github/workflows/public-staging-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: public-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production portal security boundaries and official site
        run: node --test ops/public-staging-smoke.test.mjs
