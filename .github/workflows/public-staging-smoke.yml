name: RIMMA staging and official-site smoke
on:
  push:
    branches: [feat/webapp-prod-prep-20260927]
    paths: ['ops/public-staging-smoke.test.mjs', '.github/workflows/public-staging-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify remote HTTPS, staging lock and official site
        run: node --test ops/public-staging-smoke.test.mjs
