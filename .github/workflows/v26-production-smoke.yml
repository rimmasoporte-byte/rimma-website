name: RIMMA production smoke

on:
  pull_request:
    branches: [feat/webapp-prod-prep-20260927]
    paths:
      - 'ops/v26-production-smoke.test.mjs'
      - '.github/workflows/v26-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify live portal and protected APIs
        run: node --test ops/v26-production-smoke.test.mjs
