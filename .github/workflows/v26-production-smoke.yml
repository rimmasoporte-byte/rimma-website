name: RIMMA V26 production smoke

on:
  pull_request:
    branches: [feat/webapp-prod-prep-20260927]
    paths:
      - 'ops/v26-production-smoke.test.mjs'
      - '.github/workflows/v26-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify live V26 portal and protected APIs
        run: node --test ops/v26-production-smoke.test.mjs
